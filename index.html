<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAE — Your Personal AI Skincare Companion</title>
  <meta name="description" content="RAE analyzes your skin with AI, builds personalized routines, and tracks your progress." />
  <link rel="icon" href="logo.jpg" />
  
  <!-- Use DM Sans for the main font to match the app -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F2EAE0;
      --surface: #FFFBF7;
      --accent: #B05A3A;
      --text: #1E120C;
      --text-muted: #7A5C4E;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-container img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
    }
    
    .nav-links {
      display: flex;
      gap: 32px;
      background: var(--surface);
      padding: 12px 32px;
      border-radius: 100px;
      box-shadow: 0 4px 20px rgba(176,90,58,0.05);
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s;
    }
    .nav-links a.active, .nav-links a:hover {
      color: var(--text);
      font-weight: 600;
    }
    
    .download-btn {
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s, background 0.2s;
    }
    .download-btn:hover {
      background: #8A4530;
      transform: translateY(-2px);
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 60px 20px 20px;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-size: 64px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: var(--text);
    }
    .highlight {
      position: relative;
      display: inline-block;
      color: var(--text);
    }
    .highlight::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: -5%;
      width: 110%;
      height: 24px;
      background: rgba(176,90,58,0.25);
      z-index: -1;
      transform: rotate(-1deg);
      border-radius: 4px;
    }

    /* Store Buttons */
    .store-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 40px;
      margin-bottom: 60px;
    }
    .store-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 100px;
      transition: transform 0.2s;
    }
    .store-btn:hover { transform: translateY(-2px); }
    .store-btn svg { width: 24px; height: 24px; fill: white; }
    .store-btn div { text-align: left; }
    .store-btn .small { font-size: 10px; opacity: 0.8; line-height: 1; }
    .store-btn .big { font-size: 16px; font-weight: 600; line-height: 1.2; }

    /* Promo Screens Showcase */
    .promo-gallery {
      display: flex;
      gap: 2%;
      justify-content: center;
      padding: 0 24px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .promo-gallery img {
      width: 18%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(176,90,58,0.15);
      transition: transform 0.3s ease;
      object-fit: contain;
    }
    .promo-gallery img:hover {
      transform: translateY(-8px);
    }

    @media (max-width: 900px) {
      h1 { font-size: 42px; }
      .float-card { display: none; }
      nav { padding: 20px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo-container">
      <img src="logo.jpg" alt="RAE Logo">
      <span class="logo-text">Rae</span>
    </a>
    
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="contact.html">Contact Us</a>
    </div>
    
    <a href="#download" class="download-btn">Download App</a>
  </nav>

  <div class="hero">
    <h1>Your Trusted Partner for<br><span class="highlight">Healthy Skincare</span></h1>
    
    <div class="store-buttons" id="download">
      <a href="#" class="store-btn">
        <svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        <div>
          <div class="small">Download on the</div>
          <div class="big">App Store</div>
        </div>
      </a>
      
      <a href="https://play.google.com/store/apps/details?id=com.sentra.rae" class="store-btn">
        <svg viewBox="0 0 512 512"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        <div>
          <div class="small">GET IT ON</div>
          <div class="big">Google Play</div>
        </div>
      </a>
    </div>
  </div>

  <!-- Promo Screens Showcase (Single Page) -->
  <div class="promo-gallery">
    <img src="promo1.png" alt="Understand your skin" />
    <img src="promo2.png" alt="Personalised For You" />
    <img src="promo3.png" alt="Track your personal skin diary" />
    <img src="promo4.png" alt="Ask RAE" />
    <img src="promo5.png" alt="Talk to RAE" />
  </div>

</body>
</html>
