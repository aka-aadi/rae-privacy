<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us — RAE</title>
  <link rel="icon" href="logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F2EAE0;
      --surface: #FFFBF7;
      --accent: #B05A3A;
      --text: #1E120C;
      --text-muted: #7A5C4E;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); }

    /* Navbar */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 48px; max-width: 1400px; margin: 0 auto;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-container img { width: 40px; height: 40px; border-radius: 10px; }
    .logo-text { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
    
    .nav-links {
      display: flex; gap: 32px; background: var(--surface);
      padding: 12px 32px; border-radius: 100px;
      box-shadow: 0 4px 20px rgba(176,90,58,0.05);
    }
    .nav-links a { text-decoration: none; color: var(--text-muted); font-weight: 500; font-size: 15px; transition: color 0.2s; }
    .nav-links a.active, .nav-links a:hover { color: var(--text); font-weight: 600; }
    
    .download-btn {
      background: var(--accent); color: white; text-decoration: none;
      padding: 14px 28px; border-radius: 100px; font-weight: 600; font-size: 15px;
    }

    /* Contact Container */
    .contact-container {
      max-width: 600px; margin: 60px auto 100px;
      background: var(--surface); padding: 48px;
      border-radius: 24px; box-shadow: 0 20px 40px rgba(176,90,58,0.08);
      text-align: center;
    }
    h1 { font-size: 40px; font-weight: 800; margin-bottom: 12px; }
    p.subtitle { color: var(--text-muted); margin-bottom: 40px; }

    form { display: flex; flex-direction: column; gap: 20px; text-align: left; }
    label { font-weight: 600; font-size: 14px; color: var(--text); }
    input, textarea {
      width: 100%; padding: 16px; border-radius: 12px;
      border: 1px solid rgba(176,90,58,0.2);
      background: var(--bg); font-size: 15px; outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 120px; }
    button {
      background: var(--accent); color: white; padding: 16px;
      border: none; border-radius: 12px; font-weight: 700; font-size: 16px;
      cursor: pointer; transition: background 0.2s; margin-top: 10px;
    }
    button:hover { background: #8A4530; }

    @media (max-width: 768px) {
      nav { padding: 20px; } .nav-links { display: none; }
      .contact-container { margin: 40px 20px; padding: 32px 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo-container">
      <img src="logo.png" alt="RAE Logo">
      <span class="logo-text">Rae</span>
    </a>
    
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
      <a href="contact.html" class="active">Contact Us</a>
    </div>
    
    <a href="index.html#download" class="download-btn">Download App</a>
  </nav>

  <div class="contact-container">
    <h1>Contact Us</h1>
    <p class="subtitle">Have a question or need support? We're here to help.</p>

    <form onsubmit="event.preventDefault(); alert('Thank you for your message. We will get back to you shortly!');">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Jane Doe" />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="jane@example.com" />
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" required placeholder="How can we help you?"></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
